<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <defs>
    <style>
      .bg{fill:#08111d}.panel{fill:#101d2d;stroke:#33475e;stroke-width:2}.panel2{fill:#0c1725;stroke:#33475e;stroke-width:2}
      .t{font:700 34px Arial,sans-serif;fill:#f5f7fa}.h{font:700 21px Arial,sans-serif;fill:#f5f7fa}.l{font:700 14px Arial,sans-serif;fill:#f5f7fa}
      .b{font:400 14px Arial,sans-serif;fill:#cad4df}.s{font:400 12px Arial,sans-serif;fill:#aebbc9}.x{font:400 11px Arial,sans-serif;fill:#92a1b2}
      .blue{fill:#83d7f7}.green{fill:#67d3a0}.copper{fill:#c98236}.gold{fill:#f0b44d}.violet{fill:#c4a6f5}
      .gen{fill:#22364c;stroke:#83d7f7;stroke-width:2}.bess{fill:#203a33;stroke:#67d3a0;stroke-width:2}.ctrl{fill:#3b2d20;stroke:#c98236;stroke-width:2}
      .bus{fill:#162333;stroke:#f0b44d;stroke-width:2}.load{fill:#332a3d;stroke:#c4a6f5;stroke-width:2}.wire{fill:none;stroke:#83d7f7;stroke-width:5}.wireg{fill:none;stroke:#67d3a0;stroke-width:5}.dash{stroke-dasharray:8 7}
    </style>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#83d7f7"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#67d3a0"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1240"/>
  <text x="50" y="57" class="t">NORTHERN VIRGINIA HYBRID MICROGRID BENCHMARK</text>
  <text x="50" y="87" class="b">Measured-load sizing • modular generation • DEIF-controlled redundancy • conceptual, not for construction</text>

  <rect x="50" y="115" width="1500" height="105" rx="14" class="panel"/>
  <text x="75" y="147" class="l blue">REQUESTED 480 V CONTINGENCY</text><text x="75" y="184" class="h">2,000 A</text><text x="190" y="184" class="s">480 V • 3-phase • 1,663 kVA • 1,330 kW at 0.80 PF</text>
  <text x="620" y="147" class="l green">DOCUMENTED OPERATING EVIDENCE</text><text x="620" y="184" class="h">176.4 kW gen peak</text><text x="820" y="184" class="s">≈265 A at 480 V / 0.80 PF • source also reports 502 A at 208 V</text>
  <text x="1230" y="147" class="l copper">DESIGN RULE</text><text x="1230" y="177" class="b">Size normal operation from measured load.</text><text x="1230" y="198" class="s">Protect the contingency with modular redundancy.</text>

  <rect x="50" y="245" width="1500" height="285" rx="16" class="panel"/>
  <text x="75" y="280" class="h">One-line operating concept</text>
  <text x="75" y="304" class="s">Four modular 500 kW generators provide 1,500 kW firm with one unavailable; DEIF rotates duty and controls recharge during a contingency.</text>

  <rect x="80" y="340" width="230" height="135" rx="10" class="gen"/><text x="195" y="370" text-anchor="middle" class="l">4 × 500 kW GENERATORS</text><text x="195" y="397" text-anchor="middle" class="b">2,000 kW installed</text><text x="195" y="420" text-anchor="middle" class="b">1,500 kW firm (one offline)</text><text x="195" y="449" text-anchor="middle" class="s">170 kW contingency headroom</text>
  <rect x="385" y="340" width="235" height="135" rx="10" class="bess"/><text x="502" y="370" text-anchor="middle" class="l">7 × VIRIDI RPS150</text><text x="502" y="397" text-anchor="middle" class="b">210 kW installed continuous</text><text x="502" y="420" text-anchor="middle" class="b">180 kW firm with one offline</text><text x="502" y="449" text-anchor="middle" class="s">924 kWh usable • 792 kWh firm</text>
  <rect x="695" y="340" width="205" height="135" rx="10" class="ctrl"/><text x="798" y="370" text-anchor="middle" class="l">DEIF CONTROL</text><text x="798" y="397" text-anchor="middle" class="b">lead / lag rotation</text><text x="798" y="420" text-anchor="middle" class="b">parallel • transfer • recharge</text><text x="798" y="449" text-anchor="middle" class="s">maintenance without interruption</text>
  <rect x="975" y="340" width="190" height="135" rx="10" class="bus"/><text x="1070" y="370" text-anchor="middle" class="l">480 V MICROGRID BUS</text><text x="1070" y="400" text-anchor="middle" class="b">protected switchgear</text><text x="1070" y="426" text-anchor="middle" class="s">modular sources</text>
  <rect x="1235" y="340" width="140" height="135" rx="10" class="panel2"/><text x="1305" y="370" text-anchor="middle" class="l">CUSTOMER GEAR</text><text x="1305" y="398" text-anchor="middle" class="b">480 V • 3-phase</text><text x="1305" y="425" text-anchor="middle" class="s">metering / protection</text>
  <rect x="1430" y="340" width="90" height="135" rx="10" class="load"/><text x="1475" y="370" text-anchor="middle" class="l">LOAD</text><text x="1475" y="398" text-anchor="middle" class="b">176 kW</text><text x="1475" y="423" text-anchor="middle" class="s">measured</text><text x="1475" y="449" text-anchor="middle" class="s">2,000 A req.</text>
  <rect x="1000" y="476" width="350" height="40" rx="8" class="panel2"/><text x="1175" y="501" text-anchor="middle" class="s">OPTIONAL 480 → 208/120 V STEP-DOWN BRANCH</text>
  <path d="M310 382H695" class="wire" marker-end="url(#ab)"/><path d="M620 440H695" class="wireg" marker-end="url(#ag)"/><path d="M900 407H975" class="wire" marker-end="url(#ab)"/><path d="M1165 407H1235" class="wire" marker-end="url(#ab)"/><path d="M1375 407H1430" class="wire" marker-end="url(#ab)"/><path d="M1070 475V476" class="wire"/>
  <text x="500" y="362" text-anchor="middle" class="x">GENERATOR LOAD + RECHARGE PATH</text><text x="655" y="463" text-anchor="middle" class="x">BATTERY-FIRST PATH</text>

  <rect x="50" y="555" width="1000" height="620" rx="16" class="panel"/>
  <text x="75" y="590" class="h">Conceptual site layout — enhanced maintenance configuration</text><text x="75" y="614" class="s">Approx. 205 ft × 110 ft planning envelope. Delivered dimensions, setbacks, cable routes and transformer arrangement require field verification.</text>
  <rect x="75" y="640" width="950" height="500" rx="8" fill="#0a1421" stroke="#53677d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="88" y="660" class="x">TOP-DOWN SCALE: 1 FT ≈ 3.6 PX • EQUIPMENT BODIES SHOWN TO PLANNING ENVELOPE</text>
  <rect x="90" y="1045" width="920" height="75" rx="4" fill="#1c2b3b"/><text x="550" y="1088" text-anchor="middle" class="s">20 FT ACCESS / DELIVERY / SERVICE LANE</text>

  <!-- 500 kW fleet-class planning bodies: 25 ft × 11 ft each -->
  <g><rect x="100" y="690" width="90" height="40" rx="4" class="gen"/><text x="145" y="714" text-anchor="middle" class="s">GEN 1 • 500 kW</text><rect x="100" y="755" width="90" height="40" rx="4" class="gen"/><text x="145" y="779" text-anchor="middle" class="s">GEN 2 • 500 kW</text><rect x="100" y="820" width="90" height="40" rx="4" class="gen"/><text x="145" y="844" text-anchor="middle" class="s">GEN 3 • 500 kW</text><rect x="100" y="885" width="90" height="40" rx="4" class="gen"/><text x="145" y="909" text-anchor="middle" class="s">GEN 4 • 500 kW</text></g>
  <text x="215" y="704" class="s">25 × 11 ft each</text><text x="215" y="725" class="x">DEIF lead/lag rotation</text><text x="215" y="769" class="s">Three available</text><text x="215" y="790" class="x">1,500 kW firm</text><text x="215" y="834" class="s">Fourth rotates</text><text x="215" y="855" class="x">maintenance reserve</text><text x="215" y="899" class="s">Clearances separate</text><text x="215" y="920" class="x">field verify</text>

  <!-- Controls 12 × 8 ft; switchgear 24 × 8 ft -->
  <rect x="385" y="690" width="43" height="29" rx="3" class="ctrl"/><text x="406" y="743" text-anchor="middle" class="x">DEIF / EMS</text><text x="406" y="759" text-anchor="middle" class="x">12 × 8 ft</text>
  <rect x="485" y="690" width="86" height="29" rx="3" class="bus"/><text x="528" y="743" text-anchor="middle" class="x">SWITCHGEAR</text><text x="528" y="759" text-anchor="middle" class="x">24 × 8 ft</text>

  <!-- Viridi fleet-class planning bodies: 16 ft × 7 ft each -->
  <g><rect x="385" y="815" width="58" height="25" rx="3" class="bess"/><text x="414" y="832" text-anchor="middle" class="x">BESS 1</text><rect x="465" y="815" width="58" height="25" rx="3" class="bess"/><text x="494" y="832" text-anchor="middle" class="x">BESS 2</text><rect x="545" y="815" width="58" height="25" rx="3" class="bess"/><text x="574" y="832" text-anchor="middle" class="x">BESS 3</text><rect x="625" y="815" width="58" height="25" rx="3" class="bess"/><text x="654" y="832" text-anchor="middle" class="x">BESS 4</text><rect x="385" y="865" width="58" height="25" rx="3" class="bess"/><text x="414" y="882" text-anchor="middle" class="x">BESS 5</text><rect x="465" y="865" width="58" height="25" rx="3" class="bess"/><text x="494" y="882" text-anchor="middle" class="x">BESS 6</text><rect x="545" y="865" width="58" height="25" rx="3" class="bess"/><text x="574" y="882" text-anchor="middle" class="x">BESS 7</text></g>
  <text x="385" y="920" class="s">RPS150 planning body: 16 × 7 ft each</text><text x="385" y="941" class="x">30 kW continuous • 132 kWh usable per unit</text>

  <!-- Transformer and fuel/service planning zones -->
  <rect x="730" y="690" width="58" height="36" rx="3" class="bus"/><text x="759" y="748" text-anchor="middle" class="x">XFMR • 16 × 10 ft</text>
  <rect x="850" y="690" width="108" height="43" rx="3" class="ctrl"/><text x="904" y="756" text-anchor="middle" class="x">FUEL/SERVICE • 30 × 12 ft</text>
  <path d="M190 710H385M428 704H485M571 704H730M443 827H730" stroke="#53677d" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <text x="730" y="825" class="s">Concept only</text><text x="730" y="849" class="x">Cable routes, fire separation,</text><text x="730" y="870" class="x">grounding, fuel tank, transformer</text><text x="730" y="891" class="x">and protection require field, vendor</text><text x="730" y="912" class="x">and engineering verification.</text>

  <rect x="1075" y="555" width="475" height="620" rx="16" class="panel"/>
  <text x="1100" y="590" class="h">Benchmark checks every report should show</text>
  <circle cx="1110" cy="637" r="11" class="green"/><text x="1135" y="642" class="b">Measured peak separated from service rating</text>
  <circle cx="1110" cy="680" r="11" class="green"/><text x="1135" y="685" class="b">Continuous BESS output and usable energy</text>
  <circle cx="1110" cy="723" r="11" class="green"/><text x="1135" y="728" class="b">Duty, standby and maintenance-reserve counts</text>
  <circle cx="1110" cy="766" r="11" class="green"/><text x="1135" y="771" class="b">Firm capacity after one unit is unavailable</text>
  <circle cx="1110" cy="809" r="11" class="green"/><text x="1135" y="814" class="b">Generator carries load plus controlled recharge</text>
  <circle cx="1110" cy="852" r="11" class="gold"/><text x="1135" y="857" class="b">RED FLAG: single large generator / single failure point</text>
  <rect x="1100" y="881" width="425" height="43" rx="7" fill="#382a1d" stroke="#f0b44d"/><text x="1312" y="899" text-anchor="middle" class="s">480 V contingency: 1,330 kW • N+1 firm plant: 1,500 kW</text><text x="1312" y="916" text-anchor="middle" class="s">Preferred space-permitting benchmark: 4 × 500 kW</text>
  <text x="1100" y="985" class="l">EVIDENCE CLASS</text>
  <text x="1100" y="1014" class="s"><tspan class="green">KNOWN</tspan><tspan> • source-recorded 502 A / 208 V and 176.4 kW generator peak</tspan></text>
  <text x="1100" y="1041" class="s"><tspan class="blue">CALCULATED</tspan><tspan> • 480 V current, kVA, kW and firm-capacity arithmetic</tspan></text>
  <text x="1100" y="1068" class="s"><tspan class="copper">PLANNING CHOICE</tspan><tspan> • four 500 kW generators and seven RPS150 units</tspan></text>
  <text x="1100" y="1095" class="s">FIELD VERIFY • delivered dimensions, protection, cable route and availability</text>
  <text x="50" y="1215" class="x">Internal benchmark • Field evidence remains 502 A at 208 V and 176.4 kW documented generator peak; 480 V current is an equivalent-power calculation.</text>
</svg>
